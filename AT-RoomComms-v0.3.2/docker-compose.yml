services:
  at-roomcomms:
    build: .
    container_name: at-roomcomms
    restart: unless-stopped
    ports:
      - "5070:5070"
    environment:
      ROOMCOMMS_DATA: /data
    volumes:
      - roomcomms-data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5070/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  roomcomms-data:
